name: MLOps CI/CD & Quality Gates

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  mlops-validation:
    name: Feature Tests, Drift Check & Model Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install OpenMP and Python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libgomp1
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MLOps Schema, Drift & Quality Gate Tests
        run: |
          python tests/test_mlops_pipeline.py
